# Builds the page, runs the tests and checks both platforms build, on every
# push and pull request.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the page (type-checks it first)
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Formatting
        run: test -z "$(gofmt -l backend)" || { gofmt -l backend; exit 1; }
      - name: Vet (Linux and Windows)
        run: |
          go vet ./...
          GOOS=windows go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build (Linux and Windows)
        run: |
          go build -o /dev/null ./backend/cmd/houridle
          GOOS=windows go build -o /dev/null ./backend/cmd/houridle
