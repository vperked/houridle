# Runs the tests and checks both platforms build, on every push and pull request.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Formatting
        run: test -z "$(gofmt -l backend)" || { gofmt -l backend; exit 1; }
      - name: Vet (Linux and Windows)
        run: |
          go vet ./...
          GOOS=windows go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build (Linux and Windows)
        run: |
          go build -o /dev/null ./backend
          GOOS=windows go build -o /dev/null ./backend

  # The status page's built files are committed (so building houridle needs
  # only Go); this checks they match the frontend's source.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the status page
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Check the committed build is up to date
        run: |
          if ! git diff --exit-code --stat -- backend/web/dist; then
            echo "The built status page is out of date. Run: cd frontend && npm run build, then commit backend/web/dist"
            exit 1
          fi
