<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="robots" content="noindex" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="houridle" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" href="/assets/app-icon-180.png" />
    <link rel="icon" type="image/png" href="/assets/app-icon-192.png" />
    <title>houridle</title>
  </head>
  <body>
    <div id="root">
      <!-- The loading screen until the page's script takes over (same markup as components/Splash.tsx). -->
      <div class="splash" role="status" aria-live="polite" aria-busy="true">
        <div class="splash-inner">
          <span class="splash-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <circle cx="12" cy="12" r="9" />
              <line class="splash-hour" x1="12" y1="12" x2="12" y2="8.5" />
              <line class="splash-minute" x1="12" y1="12" x2="12" y2="6" />
            </svg>
          </span>
          <span class="splash-name">houridle</span>
          <span class="splash-note">Loading…</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
